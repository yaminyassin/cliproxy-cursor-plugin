name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run tests
        run: go test ./...

      - name: Validate custom plugin registry
        run: ./scripts/validate-registry.sh

      - name: Validate release package contract
        run: make package VERSION=0.0.0

      - name: Inspect package layout
        run: unzip -l dist/cursor_0.0.0_linux_amd64.zip
